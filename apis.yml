aid: baublebar
name: BaubleBar
description: >-
  BaubleBar is a direct-to-consumer fashion jewelry and accessories brand founded
  in 2011 and headquartered in New York City, selling affordable, trend-driven
  earrings, necklaces, bracelets, rings, hair accessories, personalized "Design
  Your Own" pieces, and home and gift items through its own e-commerce storefront
  and wholesale partners. The baublebar.com storefront runs on Shopify: it exposes
  a live Shopify Storefront MCP server for agent-driven catalog search and cart
  operations, and authenticates shoppers through Shopify's Customer Account API
  using OpenID Connect / OAuth 2.0 with PKCE. BaubleBar is backed by Accel and was
  added to the API Evangelist network from that portfolio.
